<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saneca Mack — Listen Now</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --black: #050505;
      --deep: #0b0b0b;
      --white: #f5f5f5;
      --gray: #999;
      --line: rgba(255,255,255,.14);
      --accent: #ffffff;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.08), transparent 32%),
        linear-gradient(180deg, #111 0%, #050505 55%, #000 100%);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    /* =========================
       BILLBOARD FRAME
    ========================= */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
    }
    .billboard {
      position: relative;
      width: min(1180px, 100%);
      min-height: 680px;
      background: #080808;
      border: 1px solid rgba(255,255,255,.2);
      overflow: hidden;
      box-shadow:
        0 0 0 8px #111,
        0 25px 80px rgba(0,0,0,.8);
    }
    /* =========================
       DECORATIVE LIGHTS
    ========================= */
    .light {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }
    .light.one {
      width: 300px;
      height: 300px;
      top: -160px;
      left: -100px;
      background: rgba(255,255,255,.06);
    }
    .light.two {
      width: 500px;
      height: 500px;
      right: -260px;
      bottom: -280px;
      background: rgba(255,255,255,.04);
    }
    /* =========================
       TOP BAR
    ========================= */
    .topbar {
      position: relative;
      z-index: 2;
      height: 58px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      letter-spacing: 2px;
      font-size: 11px;
      text-transform: uppercase;
    }
    .brand {
      font-weight: 800;
      color: #fff;
    }
    .live {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aaa;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: .35;
        transform: scale(.75);
      }
    }
    /* =========================
       MAIN BILLBOARD
    ========================= */
    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      min-height: 620px;
    }
    /* =========================
       LEFT SIDE
    ========================= */
    .headline {
      padding: 75px 45px 50px 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(55px, 8vw, 105px);
      line-height: .82;
      letter-spacing: -6px;
      text-transform: uppercase;
      font-weight: 900;
    }
    h1 span {
      display: block;
    }
    h1 .outline {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,.75);
    }
    .subheading {
      max-width: 390px;
      margin-top: 32px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
    }
    .artist {
      margin-top: 35px;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
      font-weight: bold;
    }
    /* =========================
       PLAYER AREA
    ========================= */
    .player-zone {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 45px;
    }
    .player-card {
      width: 100%;
      background: #111;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        0 30px 60px rgba(0,0,0,.55);
      padding: 18px;
    }
    .player-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 5px 16px;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #777;
    }
    .player-label strong {
      color: #ddd;
      font-weight: 600;
    }
    /* Samply iframe */
    .samply-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      min-height: 420px;
      overflow: hidden;
    }
    .samply-wrapper iframe {
      display: block;
      width: 100%;
      height: 420px;
      border: 0;
      background: #000;
    }
    /* =========================
       BOTTOM INFO
    ========================= */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding: 18px 5px 4px;
      color: #777;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .bottom strong {
      color: #ddd;
    }
    /* =========================
       SIDE MARKING
    ========================= */
    .vertical {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%) rotate(90deg);
      font-size: 8px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      white-space: nowrap;
    }
    /* =========================
       BILLBOARD FOOTER
    ========================= */
    .footer {
      position: absolute;
      bottom: 18px;
      left: 55px;
      color: #555;
      font-size: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 850px) {
      .page {
        padding: 15px;
      }
      .billboard {
        min-height: auto;
        box-shadow:
          0 0 0 4px #111,
          0 20px 50px rgba(0,0,0,.8);
      }
      .content {
        grid-template-columns: 1fr;
      }
      .headline {
        min-height: 380px;
        padding: 55px 30px 35px;
      }
      h1 {
        font-size: clamp(55px, 18vw, 95px);
        letter-spacing: -5px;
      }
      .subheading {
        margin-top: 25px;
      }
      .artist {
        margin-top: 25px;
      }
      .player-zone {
        padding: 15px;
        padding-bottom: 55px;
      }
      .player-card {
        padding: 12px;
      }
      .samply-wrapper {
        min-height: 390px;
      }
      .samply-wrapper iframe {
        height: 390px;
      }
      .topbar {
        padding: 0 18px;
      }
      .vertical {
        display: none;
      }
      .footer {
        left: 30px;
        bottom: 15px;
      }
      .bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
    @media (max-width: 480px) {
      .headline {
        min-height: 320px;
      }
      .eyebrow {
        letter-spacing: 3px;
      }
      .subheading {
        font-size: 12px;
      }
      .samply-wrapper iframe {
        height: 370px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="billboard">
      <!-- Decorative lighting -->
      <div class="light one"></div>
      <div class="light two"></div>
      <!-- Top navigation -->
      <header class="topbar">
        <div class="brand">
          SANECA MACK
        </div>
        <div class="live">
          <span class="live-dot"></span>
          NOW PLAYING
        </div>
      </header>
      <!-- Main billboard content -->
      <div class="content">
        <!-- Billboard headline -->
        <section class="headline">
          <div class="eyebrow">
            New Music
          </div>
          <h1>
            <span>PLAY</span>
            <span class="outline">IT</span>
            <span>LOUD.</span>
          </h1>
          <p class="subheading">
            Press play. Turn it up. Stay with it.
            This is the music.
          </p>
          <div class="artist">
            SANeca Mack
          </div>
        </section>
        <!-- Embedded Samply player -->
        <section class="player-zone">
          <div class="player-card">
            <div class="player-label">
              <span>Official Player</span>
              <strong>Listen</strong>
            </div>
            <div class="samply-wrapper">
              <iframe
                src="https://samply.app/embed/mGjsOX030QnRsxoGJhJ7"
                title="Saneca Mack Music Player"
                allow="autoplay; encrypted-media"
                loading="lazy">
              </iframe>
            </div>
            <div class="bottom">
              <span>
                <strong>Music</strong> / Official Stream
              </span>
              <span>
                SANECA MACK
              </span>
            </div>
          </div>
        </section>
      </div>
      <!-- Decorative vertical text -->
      <div class="vertical">
        MUSIC • SOUND • MOVEMENT • SANECA MACK
      </div>
      <div class="footer">
        HOUSE OF MEDIA
      </div>
    </section>
  </main>
</body>
</html>
